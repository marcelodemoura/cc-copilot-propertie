server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/copilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: never

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

indexer:
  base-path: ${INDEXER_BASE_PATH:.}

api:
  key: ${API_KEY:local-dev-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

copilot:
  ci:
    fail-on-critical: true
  policy:
    allow-contract-dto: true
    allow-internal-dto-leak: false
  code-modification:
    enabled: ${CODE_MODIFICATION_ENABLED:true}

llm:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: ${OPENAI_TEMPERATURE:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5-coder}
    embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [tenant=%X{tenantId:-none}] [req=%X{requestId:-none}] %-5level %logger{36} - %msg%n"

