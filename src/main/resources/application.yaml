spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/copilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: always

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:openai}

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

indexer:
  base-path: ${INDEXER_BASE_PATH:.}

api:
  key: ${API_KEY:local-dev-key}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

copilot:
  ci:
    fail-on-critical: true
  policy:
    allow-contract-dto: true
    allow-internal-dto-leak: false

llm:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    temperature: ${OPENAI_TEMPERATURE:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5-coder}
    embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
